schema_version: 1

project:
  id: mimic-iv-sepsis-deescalation
  repo: vafaei-ar/mimic-iv-sepsis-deescalation
  visibility: public

execution:
  profile: safe
  approval_default: manual
  machine_binding: fixed
  machine_id: pshjl4vf24
  runner_source: runrelay_control_repo
  exact_commit: true
  allow_arbitrary_commands: false

security:
  project_only_filesystem: true
  network_access: true
  inherit_environment: false
  destructive_operations: false

monitoring:
  heartbeat_seconds: 60
  telegram_include_log_tail: true
  tmux_default: false

tasks:
  psu_publication_parity_check:
    description: Rerun the frozen PSU publication entry points and verify aggregate parity against accepted publication values; no new scientific definitions and no row-level artifacts.
    command:
      - .venv/bin/python
      - scripts/check_psu_publication_parity.py
      - /home/asadr/Depts/PHS/PATH_CDM/Hwang_Bonavia
      - --output-dir
      - outputs/psu_publication_parity/latest
    approval: manual
    timeout_minutes: 90
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/psu_publication_parity/latest/parity_report.json
      - outputs/psu_publication_parity/latest/parity_checks.csv

  publication_output_inventory:
    description: Inventory only project-local aggregate outputs to identify the frozen MIMIC and PSU publication result packages; do not read or export patient-level data.
    command:
      - .venv/bin/python
      - scripts/build_publication_inventory.py
    approval: manual
    timeout_minutes: 10
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/publication_integration/inventory/publication_output_inventory.json
      - outputs/publication_integration/inventory/publication_output_inventory.csv

  publication_source_snapshot:
    description: Collect the exact frozen aggregate MIMIC and PSU publication source tables into a sanitized snapshot; no patient-level data and no estimand recomputation.
    command:
      - .venv/bin/python
      - scripts/build_publication_source_snapshot.py
    approval: manual
    timeout_minutes: 10
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/publication_integration/source_snapshot/publication_source_snapshot.json
      - outputs/publication_integration/source_snapshot/publication_source_files.csv

  publication_harmonized_tables:
    description: Build manuscript-facing harmonized MIMIC-IV and PSU tables from the frozen aggregate source snapshot; no model refitting and no patient-level data.
    command:
      - .venv/bin/python
      - scripts/build_publication_integration.py
    approval: manual
    timeout_minutes: 10
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/publication_integration/harmonized/harmonized_mortality_results.csv
      - outputs/publication_integration/harmonized/harmonized_secondary_outcomes.csv
      - outputs/publication_integration/harmonized/mimic_progressive_adjustment.csv
      - outputs/publication_integration/harmonized/weighting_diagnostics.csv
      - outputs/publication_integration/harmonized/publication_integration_summary.md

  publication_manuscript_package:
    description: Build manuscript-facing Results and Discussion text plus figure/table data from frozen harmonized aggregate outputs; no model refitting and no patient-level data.
    command:
      - .venv/bin/python
      - scripts/build_manuscript_package.py
    approval: manual
    timeout_minutes: 10
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/publication_integration/manuscript_package/manuscript_results_discussion_draft.md
      - outputs/publication_integration/manuscript_package/figure2_mimic_progressive_adjustment.csv
      - outputs/publication_integration/manuscript_package/figure4_mimic_psu_mortality.csv
      - outputs/publication_integration/manuscript_package/table_main_secondary_outcomes.csv

  publication_nature_package:
    description: Build Nature Portfolio and Nature Communications-compatible manuscript, cover letter, checklist, Extended Data plan, word counts, and publication figures from frozen aggregate outputs only.
    command:
      - .venv/bin/python
      - scripts/build_nature_publication_package.py
    approval: manual
    timeout_minutes: 10
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/publication_integration/nature_package/nature_manuscript.md
      - outputs/publication_integration/nature_package/nature_cover_letter.md
      - outputs/publication_integration/nature_package/nature_submission_checklist.md
      - outputs/publication_integration/nature_package/nature_extended_data_plan.md
      - outputs/publication_integration/nature_package/nature_wordcounts.csv
      - outputs/publication_integration/nature_package/figure1_target_trial_timeline.png
      - outputs/publication_integration/nature_package/figure1_target_trial_timeline.pdf
      - outputs/publication_integration/nature_package/figure2_mimic_progressive_adjustment.png
      - outputs/publication_integration/nature_package/figure2_mimic_progressive_adjustment.pdf
      - outputs/publication_integration/nature_package/figure3_cross_dataset_mortality.png
      - outputs/publication_integration/nature_package/figure3_cross_dataset_mortality.pdf
      - outputs/publication_integration/nature_package/figure4_stewardship_outcomes.png
      - outputs/publication_integration/nature_package/figure4_stewardship_outcomes.pdf

  publication_icm_package:
    description: Build an Intensive Care Medicine original-paper aggregate package from frozen outputs only, including a <=3000-word manuscript, structured abstract, take-home message, cover letter, checklist, and ICM-style figures; DOCX assembly is performed separately after validation.
    command:
      - .venv/bin/python
      - scripts/build_icm_publication_package_nodocx.py
    approval: manual
    timeout_minutes: 10
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/publication_integration/icm_package/ICM_manuscript_draft.md
      - outputs/publication_integration/icm_package/ICM_cover_letter.md
      - outputs/publication_integration/icm_package/ICM_submission_checklist.md
      - outputs/publication_integration/icm_package/ICM_wordcounts.csv
      - outputs/publication_integration/icm_package/Fig1_target_trial_timeline.png
      - outputs/publication_integration/icm_package/Fig1_target_trial_timeline.pdf
      - outputs/publication_integration/icm_package/Fig2_progressive_adjustment.png
      - outputs/publication_integration/icm_package/Fig2_progressive_adjustment.pdf
      - outputs/publication_integration/icm_package/Fig3_cross_dataset_results.png
      - outputs/publication_integration/icm_package/Fig3_cross_dataset_results.pdf

  publication_reviewer_support:
    description: Generate reviewer-support aggregates and revised publication figures from the frozen final MIMIC cohort and harmonized aggregate outputs; includes exploratory narrowing-versus-stopping sensitivities but does not alter the frozen primary estimand.
    command:
      - .venv/bin/python
      - scripts/build_reviewer_support_package_fast.py
    approval: manual
    timeout_minutes: 90
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/publication_integration/reviewer_support/mimic_cohort_flow_reviewer.csv
      - outputs/publication_integration/reviewer_support/mimic_deescalation_subtype_descriptives.csv
      - outputs/publication_integration/reviewer_support/mimic_deescalation_subtype_adjusted_mortality.csv
      - outputs/publication_integration/reviewer_support/mimic_deescalation_subtype_bootstrap_diagnostics.csv
      - outputs/publication_integration/reviewer_support/mimic_primary_balance_before_after.csv
      - outputs/publication_integration/reviewer_support/mimic_ps_weight_quantiles.csv
      - outputs/publication_integration/reviewer_support/reviewer_support_summary.md
      - outputs/publication_integration/reviewer_support/reviewer_support_metadata.json
      - outputs/publication_integration/reviewer_support/Fig1_target_trial_timeline_revised.png
      - outputs/publication_integration/reviewer_support/Fig1_target_trial_timeline_revised.pdf
      - outputs/publication_integration/reviewer_support/Fig2_progressive_adjustment_revised.png
      - outputs/publication_integration/reviewer_support/Fig2_progressive_adjustment_revised.pdf
      - outputs/publication_integration/reviewer_support/Fig3_cross_dataset_outcomes_revised.png
      - outputs/publication_integration/reviewer_support/Fig3_cross_dataset_outcomes_revised.pdf
      - outputs/publication_integration/reviewer_support/ESM_Fig1_mimic_balance_love.png
      - outputs/publication_integration/reviewer_support/ESM_Fig1_mimic_balance_love.pdf
      - outputs/publication_integration/reviewer_support/ESM_Fig2_mimic_ps_weights.png
      - outputs/publication_integration/reviewer_support/ESM_Fig2_mimic_ps_weights.pdf

  publication_reviewer_subtype_narrowed:
    description: Run only the exploratory 1000-replicate MIMIC narrowing/non-broad versus continued-broad mortality sensitivity; no change to the frozen primary analysis.
    command:
      - .venv/bin/python
      - scripts/run_reviewer_subtype_sensitivity.py
      - --contrast
      - narrowed
      - --reps
      - "1000"
    approval: manual
    timeout_minutes: 120
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/publication_integration/reviewer_support/mimic_deescalation_subtype_narrowed_adjusted_mortality.csv
      - outputs/publication_integration/reviewer_support/mimic_deescalation_subtype_narrowed_bootstrap_diagnostics.csv
      - outputs/publication_integration/reviewer_support/mimic_deescalation_subtype_narrowed_metadata.json

  publication_reviewer_subtype_stopped:
    description: Run only the exploratory 1000-replicate MIMIC complete-stopping versus continued-broad mortality sensitivity; no change to the frozen primary analysis.
    command:
      - .venv/bin/python
      - scripts/run_reviewer_subtype_sensitivity.py
      - --contrast
      - stopped
      - --reps
      - "1000"
    approval: manual
    timeout_minutes: 120
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/publication_integration/reviewer_support/mimic_deescalation_subtype_stopped_adjusted_mortality.csv
      - outputs/publication_integration/reviewer_support/mimic_deescalation_subtype_stopped_bootstrap_diagnostics.csv
      - outputs/publication_integration/reviewer_support/mimic_deescalation_subtype_stopped_metadata.json

  publication_reviewer_final_assets:
    description: Combine completed reviewer-support subtype outputs and build final publication figures from frozen aggregate results; no model fitting or primary-analysis changes.
    command:
      - .venv/bin/python
      - scripts/build_reviewer_final_assets.py
    approval: manual
    timeout_minutes: 10
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/publication_integration/reviewer_support/mimic_deescalation_subtype_adjusted_mortality_combined.csv
      - outputs/publication_integration/reviewer_support/reviewer_support_final_summary.md
      - outputs/publication_integration/reviewer_support/reviewer_support_final_metadata.json
      - outputs/publication_integration/reviewer_support/Fig1_target_trial_timeline_final.png
      - outputs/publication_integration/reviewer_support/Fig1_target_trial_timeline_final.pdf
      - outputs/publication_integration/reviewer_support/Fig2_progressive_adjustment_final.png
      - outputs/publication_integration/reviewer_support/Fig2_progressive_adjustment_final.pdf
      - outputs/publication_integration/reviewer_support/Fig3_cross_dataset_outcomes_final.png
      - outputs/publication_integration/reviewer_support/Fig3_cross_dataset_outcomes_final.pdf

  publication_submission_figures:
    description: Rebuild all manuscript and ESM figures used in the clean ICM submission from committed code and frozen inputs; no primary outcome or bootstrap inference is rerun.
    command:
      - .venv/bin/python
      - scripts/build_submission_figures.py
    approval: manual
    timeout_minutes: 15
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/publication_integration/submission_figures/Fig1_target_trial_timeline.png
      - outputs/publication_integration/submission_figures/Fig1_target_trial_timeline.pdf
      - outputs/publication_integration/submission_figures/Fig2_progressive_adjustment.png
      - outputs/publication_integration/submission_figures/Fig2_progressive_adjustment.pdf
      - outputs/publication_integration/submission_figures/Fig3_cross_dataset_outcomes.png
      - outputs/publication_integration/submission_figures/Fig3_cross_dataset_outcomes.pdf
      - outputs/publication_integration/submission_figures/ESM_Fig1_mimic_balance_love.png
      - outputs/publication_integration/submission_figures/ESM_Fig1_mimic_balance_love.pdf
      - outputs/publication_integration/submission_figures/ESM_Fig2_mimic_ps_weights.png
      - outputs/publication_integration/submission_figures/ESM_Fig2_mimic_ps_weights.pdf

  publication_antibiotic_duration_descriptives:
    description: Summarize clinically interpretable post-landmark systemic antibiotic exposure days from the frozen MIMIC cohort and frozen PSU aggregate outcome summary; no model refitting or bootstrap rerun.
    command:
      - .venv/bin/python
      - scripts/build_antibiotic_duration_descriptives.py
    approval: manual
    timeout_minutes: 10
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/publication_integration/clinical_duration/antibiotic_duration_descriptives.csv
      - outputs/publication_integration/clinical_duration/antibiotic_duration_metadata.json
      - outputs/publication_integration/reviewer_support/reviewer_support_final_summary.md

  psu_facilityid_audit:
    description: Read the restricted PSU parquet source locally and emit only aggregate FACILITYID counts to document contributing facilities; no patient- or encounter-level artifacts.
    command:
      - .venv/bin/python
      - scripts/audit_psu_facilities.py
      - /home/asadr/Depts/PHS/PATH_CDM/Hwang_Bonavia
      - --output
      - outputs/publication_integration/psu_facility_audit/facilityid_summary.json
    approval: manual
    timeout_minutes: 10
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/publication_integration/psu_facility_audit/facilityid_summary.json

  psu_sepsis_cohort_nesting_audit:
    description: Reconstruct the frozen strict PSU analytic cohort locally and confirm aggregate encounter-level nesting within the upstream sepsis_encounter source; no row-level artifacts and no validation of the upstream sepsis-definition implementation.
    command:
      - .venv/bin/python
      - scripts/audit_psu_sepsis_cohort_nesting.py
      - /home/asadr/Depts/PHS/PATH_CDM/Hwang_Bonavia
      - --output
      - outputs/publication_integration/psu_sepsis_cohort_audit/sepsis_cohort_nesting.json
    approval: manual
    timeout_minutes: 10
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/publication_integration/psu_sepsis_cohort_audit/sepsis_cohort_nesting.json

  publication_nature_figures:
    description: Rebuild the preferred publication figures using the Nature-style visual system, including the combined target-trial/cohort Figure 1 and revised ESM diagnostics; no primary inference is rerun.
    command:
      - .venv/bin/python
      - scripts/build_nature_figures.py
    approval: manual
    timeout_minutes: 15
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/publication_integration/nature_figures/Fig1_target_trial_and_cohort.png
      - outputs/publication_integration/nature_figures/Fig1_target_trial_and_cohort.pdf
      - outputs/publication_integration/nature_figures/Fig2_progressive_adjustment.png
      - outputs/publication_integration/nature_figures/Fig2_progressive_adjustment.pdf
      - outputs/publication_integration/nature_figures/Fig3_cross_dataset_outcomes.png
      - outputs/publication_integration/nature_figures/Fig3_cross_dataset_outcomes.pdf
      - outputs/publication_integration/nature_figures/ESM_Fig1_covariate_balance.png
      - outputs/publication_integration/nature_figures/ESM_Fig1_covariate_balance.pdf
      - outputs/publication_integration/nature_figures/ESM_Fig2_propensity_overlap.png
      - outputs/publication_integration/nature_figures/ESM_Fig2_propensity_overlap.pdf

  repository_validation:
    description: Run public-data-free repository tests and lint checks after branch consolidation; does not access restricted MIMIC-IV or PSU data and emits no artifacts.
    command:
      - .venv/bin/python
      - scripts/validate_repository.py
    approval: manual
    timeout_minutes: 10
    requires_gpu: false
    working_directory: .
    artifacts: []
