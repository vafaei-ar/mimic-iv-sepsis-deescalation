schema_version: 1

project:
  id: mimic-iv-sepsis-deescalation
  repo: vafaei-ar/mimic-iv-sepsis-deescalation
  visibility: public

execution:
  profile: safe
  approval_default: manual
  machine_binding: fixed
  machine_id: pshjl4vf24
  runner_source: runrelay_control_repo
  exact_commit: true
  allow_arbitrary_commands: false

security:
  project_only_filesystem: true
  network_access: true
  inherit_environment: false
  destructive_operations: false

monitoring:
  heartbeat_seconds: 60
  telegram_include_log_tail: true
  tmux_default: false

tasks:
  psu_point_estimates:
    description: Estimate aggregate PSU treatment-effect point estimates using the frozen exposure, covariate, PS, and outcome definitions, with stabilized ATE IPTW primary plus overlap and weight-truncation sensitivities; no bootstrap inference.
    command:
      - .venv/bin/python
      - scripts/run_psu_point_estimates.py
      - /home/asadr/Depts/PHS/PATH_CDM/Hwang_Bonavia
      - --output-dir
      - outputs/psu_point_estimates/latest
    approval: manual
    timeout_minutes: 180
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/psu_point_estimates/latest/effect_summary.json
      - outputs/psu_point_estimates/latest/point_estimates.csv
      - outputs/psu_point_estimates/latest/effect_weighting_diagnostics.csv
      - outputs/psu_point_estimates/latest/unadjusted_outcomes_by_exposure.csv
      - outputs/psu_point_estimates/latest/covariate_balance.csv
      - outputs/psu_point_estimates/latest/ps_distribution.csv
      - outputs/psu_point_estimates/latest/weight_diagnostics.csv

  psu_bootstrap_inference:
    description: Run 1000 encounter-level nonparametric bootstrap replicates for frozen PSU treatment-effect inference, refitting the frozen PS per replicate and evaluating stabilized ATE IPTW, overlap weighting, and prespecified weight-truncation sensitivities; aggregate outputs only.
    command:
      - .venv/bin/python
      - scripts/run_psu_bootstrap_inference.py
      - /home/asadr/Depts/PHS/PATH_CDM/Hwang_Bonavia
      - --output-dir
      - outputs/psu_point_estimates/latest
    approval: manual
    timeout_minutes: 240
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/psu_point_estimates/latest/effect_summary.json
      - outputs/psu_point_estimates/latest/point_estimates.csv
      - outputs/psu_point_estimates/latest/effect_weighting_diagnostics.csv
      - outputs/psu_point_estimates/latest/bootstrap_ci.csv
      - outputs/psu_point_estimates/latest/bootstrap_diagnostics.json
