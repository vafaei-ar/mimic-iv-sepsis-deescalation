schema_version: 1

project:
  id: mimic-iv-sepsis-deescalation
  repo: vafaei-ar/mimic-iv-sepsis-deescalation
  visibility: public

execution:
  profile: safe
  approval_default: manual
  machine_binding: fixed
  machine_id: pshjl4vf24
  runner_source: runrelay_control_repo
  exact_commit: true
  allow_arbitrary_commands: false

security:
  project_only_filesystem: true
  network_access: true
  inherit_environment: false
  destructive_operations: false

monitoring:
  heartbeat_seconds: 60
  telegram_include_log_tail: true
  tmux_default: false

tasks:
  smoke_test:
    description: Non-destructive RunRelay connectivity test for the MIMIC-IV sepsis de-escalation project.
    command:
      - python3
      - -c
      - "import os,platform; print('RUNRELAY_SMOKE_OK'); print('host='+platform.node()); print('cwd='+os.getcwd())"
    approval: manual
    timeout_minutes: 5
    requires_gpu: false
    working_directory: .

  publication_freeze_summary:
    description: Build a safe aggregate publication-freeze bundle from the completed final corrected MIMIC inference outputs without exposing row-level MIMIC-IV data.
    command:
      - .venv/bin/python
      - scripts/build_publication_freeze.py
      - outputs/mimic/mimic_iv_v5_7_final_20260820T003506Z
      - --output-dir
      - outputs/publication_freeze/latest
    approval: manual
    timeout_minutes: 10
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/publication_freeze/latest/summary.json
      - outputs/publication_freeze/latest/primary_secondary_outcomes.csv
      - outputs/publication_freeze/latest/progressive_adjustment.csv
      - outputs/publication_freeze/latest/final_weighting_point_estimates.csv
      - outputs/publication_freeze/latest/final_weighting_bootstrap_ci.csv
      - outputs/publication_freeze/latest/final_weighting_bootstrap_diagnostics.csv

  psu_readonly_data_audit:
    description: Read only local PSU/PCORnet file metadata and local analysis-code references to identify harmonizable sepsis sources; export aggregate metadata only, never row-level patient data.
    command:
      - .venv/bin/python
      - scripts/audit_psu_pcornet_data.py
      - /home/asadr/Depts/PHS/PATH_CDM/Hwang_Bonavia
      - --output-dir
      - outputs/psu_pcornet_audit/latest
    approval: manual
    timeout_minutes: 20
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/psu_pcornet_audit/latest/summary.json
      - outputs/psu_pcornet_audit/latest/file_inventory.csv
      - outputs/psu_pcornet_audit/latest/parquet_schema_summary.csv
      - outputs/psu_pcornet_audit/latest/candidate_sources.csv
      - outputs/psu_pcornet_audit/latest/code_reference_summary.json

  psu_mount_diagnostic:
    description: Diagnose PSU/PCORnet filesystem accessibility using metadata-only stat/open checks and mount metadata; never read or export patient-level file contents.
    command:
      - .venv/bin/python
      - scripts/diagnose_psu_mount.py
      - /home/asadr/Depts/PHS/PATH_CDM/Hwang_Bonavia
      - --output
      - outputs/psu_mount_diagnostic/latest/summary.json
    approval: manual
    timeout_minutes: 5
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/psu_mount_diagnostic/latest/summary.json

  psu_target_trial_crosswalk:
    description: Build an aggregate-only PSU-to-MIMIC field crosswalk for ICU timing, antibiotic source, and microbiology result availability before any external cohort construction.
    command:
      - .venv/bin/python
      - scripts/audit_psu_target_trial_crosswalk.py
      - /home/asadr/Depts/PHS/PATH_CDM/Hwang_Bonavia
      - --output-dir
      - outputs/psu_target_trial_crosswalk/latest
    approval: manual
    timeout_minutes: 30
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/psu_target_trial_crosswalk/latest/summary.json
      - outputs/psu_target_trial_crosswalk/latest/timestamp_crosswalk.csv
      - outputs/psu_target_trial_crosswalk/latest/aggregate_category_counts.csv
      - outputs/psu_target_trial_crosswalk/latest/local_code_logic_summary.json
      - outputs/psu_target_trial_crosswalk/latest/microbiology_mapping_summary.json

  psu_anchor_micro_resolution:
    description: Resolve the two remaining PSU replication blockers using aggregate-only searches for ICU/ADT timing signals and microbiology/culture mappings; never export patient rows, identifiers, or result free text.
    command:
      - .venv/bin/python
      - scripts/audit_psu_anchor_micro_resolution.py
      - /home/asadr/Depts/PHS/PATH_CDM/Hwang_Bonavia
      - --output-dir
      - outputs/psu_anchor_micro_resolution/latest
    approval: manual
    timeout_minutes: 60
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/psu_anchor_micro_resolution/latest/summary.json
      - outputs/psu_anchor_micro_resolution/latest/candidate_path_inventory.csv
      - outputs/psu_anchor_micro_resolution/latest/microbiology_aggregate_counts.csv
      - outputs/psu_anchor_micro_resolution/latest/icu_observation_aggregate_counts.csv

  psu_existing_python_logic_review:
    description: Read and summarize existing Python analysis code under the PSU Hwang_Bonavia sepsis directory to recover prior cohort, ICU, antibiotic, microbiology, SOFA, and timing logic; read source code only and never patient rows.
    command:
      - .venv/bin/python
      - scripts/audit_psu_existing_python_logic.py
      - /home/asadr/Depts/PHS/PATH_CDM/Hwang_Bonavia
      - --output-dir
      - outputs/psu_existing_python_logic/latest
    approval: manual
    timeout_minutes: 30
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/psu_existing_python_logic/latest/summary.json
      - outputs/psu_existing_python_logic/latest/python_inventory.csv
      - outputs/psu_existing_python_logic/latest/relevant_code_evidence.csv
      - outputs/psu_existing_python_logic/latest/inferred_pipeline_map.json
