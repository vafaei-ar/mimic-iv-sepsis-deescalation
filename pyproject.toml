[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sepsis-deescalation"
version = "0.1.0"
description = "MIMIC-IV day-3 broad-spectrum antibiotic de-escalation analysis and PCORnet external validation"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "scipy>=1.10,<2",
  "statsmodels>=0.14,<1",
  "matplotlib>=3.7,<4",
  "PyYAML>=6,<7",
  "duckdb>=1.0,<2",
  "pyarrow>=14,<22",
  "threadpoolctl>=3,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# CI fails on syntax/name/import-order issues in the maintained package and final
# publication entry points. F401 remains ignored because several frozen audit modules
# intentionally re-export helpers for downstream scripts.
select = ["E4", "E9", "F"]
ignore = ["F401"]

[tool.ruff.lint.per-file-ignores]
# These files are retained one-off source-semantic diagnostics from the PSU audit trail.
# Their compact import style/unused temporary variables are provenance artifacts, not
# publication entry-point code. We keep the exceptions narrow and explicit rather than
# weakening lint for the maintained MIMIC/PSU pipeline as a whole.
"scripts/audit_psu_covariate_mapping_freeze_diag.py" = ["E401"]
"scripts/audit_psu_covariate_mapping_freeze_diag2.py" = ["E401"]
"scripts/audit_psu_covariate_outcome_feasibility.py" = ["F841"]
"scripts/audit_psu_effects_point.py" = ["F841"]
"scripts/audit_psu_lab_clock_alignment.py" = ["E401"]
"scripts/audit_psu_lab_clock_and_map_resolution.py" = ["E401", "F841"]
"scripts/audit_psu_lab_clock_semantics.py" = ["E401"]
"scripts/audit_psu_medadmin_clock_semantics.py" = ["E401"]
