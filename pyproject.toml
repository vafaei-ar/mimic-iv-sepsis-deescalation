[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sepsis-deescalation"
version = "0.1.0"
description = "MIMIC-IV day-3 broad-spectrum antibiotic de-escalation analysis and PCORnet external validation"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "scipy>=1.10,<2",
  "statsmodels>=0.14,<1",
  "matplotlib>=3.7,<4",
  "PyYAML>=6,<7",
  "duckdb>=1.0,<2",
  "pyarrow>=14,<22",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# During the parity refactor, CI should fail on syntax/name/import-order issues,
# but not on unused imports inherited from the notebook extraction. These will
# be cleaned after real-data parity is established.
select = ["E4", "E9", "F"]
ignore = ["F401"]
